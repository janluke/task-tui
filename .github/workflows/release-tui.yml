name: Release TUI build

# Publishes binaries of the TUI branch from this fork. It lives on `main`,
# because a workflow is only dispatchable from the default branch, and builds
# the branch given as input, so the pull request branch stays free of fork-only
# files. GoReleaser runs from the branch checkout with the configuration and
# the changelog taken from this branch.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or commit to build
        default: tui
      tag:
        description: Release tag, such as tui-v0.1.0-task-v3.53.1
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the branch to build
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          # Checking out a named ref fetches no tags, and the Task version the
          # build is based on is read with `git describe`.
          fetch-tags: true
          path: src

      - name: Check out the release configuration
        uses: actions/checkout@v7
        with:
          ref: main
          path: fork

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.27.x
          cache-dependency-path: src/go.sum

      - name: Write the release notes
        working-directory: src
        env:
          TAG: ${{ inputs.tag }}
          SOURCE_REF: ${{ inputs.ref }}
        run: |
          changelog=../fork/.github/CHANGELOG-tui.md
          awk -v heading="## $TAG" '
            $0 == heading { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' "$changelog" > section.md
          if [ ! -s section.md ] || ! grep -q '[^[:space:]]' section.md; then
            echo "No '## $TAG' section in $(basename "$changelog")." >&2
            echo "Add one on the main branch, then run this workflow again." >&2
            exit 1
          fi
          # Describe the base before tagging, so the new tag is not what it finds.
          base=$(git describe --tags --exclude=nightly --exclude='tui-*' HEAD)
          {
            echo "Unofficial build of [Task](https://github.com/go-task/task) including the TUI proposed in [go-task/task#3015](https://github.com/go-task/task/pull/3015)."
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| Built from | \`$SOURCE_REF\` at $(git rev-parse HEAD) |"
            echo "| Task base | \`$base\` |"
            cat section.md
            echo "The binary is named \`task-tui\`, so it does not replace an installed \`task\`."
            echo "Extract the archive for your platform and put \`task-tui\` on your \`PATH\`."
          } > ../notes.md
          rm section.md

      - name: Tag the commit to release
        working-directory: src
        env:
          TAG: ${{ inputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG"
          git push origin "refs/tags/$TAG"

      - name: Build and publish with GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          workdir: src
          # Validation is skipped because it requires the tag to be valid
          # SemVer, which `tui-v<tui version>-task-v<task version>` is not.
          args: >-
            release --clean --skip=validate
            --config ../fork/.github/goreleaser-tui.yml
            --release-notes ../notes.md
        env:
          GITHUB_TOKEN: ${{ github.token }}
