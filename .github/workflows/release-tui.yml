name: Release TUI build

# Publishes binaries of the TUI branch from this fork. It lives on `main`,
# because a workflow is only dispatchable from the default branch, and builds
# the branch given as input, so the pull request branch stays free of fork-only
# files.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or commit to build
        default: tui
      tag:
        description: Release tag, such as tui-v0.1.0-task-v3.53.1
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the branch to build
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.27.x

      - name: Build the binaries
        env:
          TAG: ${{ inputs.tag }}
        run: |
          mkdir dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os=${target%/*}
            arch=${target#*/}
            extension=""
            if [ "$os" = windows ]; then
              extension=".exe"
            fi
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build \
              -trimpath \
              -ldflags "-s -w -X github.com/go-task/task/v3/internal/version.version=$TAG" \
              -o "dist/task-tui$extension" \
              ./cmd/task
            tar -C dist -czf "dist/task-tui_${os}_${arch}.tar.gz" "task-tui$extension"
            rm "dist/task-tui$extension"
          done
          (cd dist && sha256sum ./*.tar.gz > checksums.txt)

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          REF: ${{ inputs.ref }}
        run: |
          commit=$(git rev-parse HEAD)
          base=$(git describe --tags --exclude=nightly HEAD)
          cat > notes.md <<EOF
          Unofficial build of [Task](https://github.com/go-task/task) including the TUI proposed in [go-task/task#3015](https://github.com/go-task/task/pull/3015).

          | | |
          | --- | --- |
          | Built from | \`$REF\` at $commit |
          | Task base | \`$base\` |

          The binary is named \`task-tui\`, so it does not replace an installed \`task\`.
          Download the archive for your platform, extract it, and put \`task-tui\` on your PATH.
          EOF
          gh release create "$TAG" dist/* \
            --target "$commit" \
            --title "$TAG" \
            --notes-file notes.md
