name: Release TUI build

# Publishes binaries of the TUI branch from this fork. It lives on `main`,
# because a workflow is only dispatchable from the default branch, and builds
# the branch given as input, so the pull request branch stays free of fork-only
# files. GoReleaser runs from the branch checkout with the configuration taken
# from this branch.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or commit to build
        default: tui
      tag:
        description: Release tag, such as tui-v0.1.0-task-v3.53.1
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the branch to build
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          path: src

      - name: Check out the release configuration
        uses: actions/checkout@v7
        with:
          ref: main
          path: fork

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.27.x
          cache-dependency-path: src/go.sum

      - name: Collect release metadata
        working-directory: src
        env:
          SOURCE_REF: ${{ inputs.ref }}
        run: |
          # Before tagging, so that the new tag is not what these describe.
          base=$(git describe --tags --exclude=nightly --exclude='tui-*' HEAD)
          previous=$(git tag --list 'tui-*' --sort=-creatordate | head -1)
          if [ -z "$previous" ]; then
            previous=$(git describe --tags --abbrev=0 --exclude=nightly --exclude='tui-*' HEAD)
          fi
          {
            echo "TASK_BASE=$base"
            echo "SOURCE_REF=$SOURCE_REF"
            echo "GORELEASER_PREVIOUS_TAG=$previous"
          } >> "$GITHUB_ENV"

      - name: Tag the commit to release
        working-directory: src
        env:
          TAG: ${{ inputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG"
          git push origin "refs/tags/$TAG"

      - name: Build and publish with GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          workdir: src
          # Validation is skipped because it requires the tag to be valid
          # SemVer, which `tui-v<tui version>-task-v<task version>` is not.
          args: release --clean --skip=validate --config ../fork/.github/goreleaser-tui.yml
        env:
          GITHUB_TOKEN: ${{ github.token }}
